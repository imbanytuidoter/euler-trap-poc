# EulerFinanceTrap deployment config.
#
# Deployment order (must be in this sequence):
#   1. Deploy EulerPauseResponse(eulerMarket, trapManager) → produces RESPONSE_ADDR
#   2. Set response_contract = RESPONSE_ADDR below
#   3. Deploy EulerFinanceTrap (no constructor args) via Drosera Operator
#
# EULER_MARKET inside EulerFinanceTrap is hardcoded to the Euler v1 markets
# contract (0x2718...25d3). For testnet/devnet, change the constant in
# EulerFinanceTrap.sol and rebuild.
#
# block_sample_size MUST be >= EulerFinanceTrap.MIN_SAMPLE_SIZE (= 5).
# shouldRespond() refuses to evaluate shorter windows because the velocity
# threshold is calibrated to a 5-block window.

[traps.euler_bad_debt_trap]
path                    = "out/EulerFinanceTrap.sol/EulerFinanceTrap.json"
response_contract       = "0x000000000000000000000000000000000000dEaD"  # REPLACE after deploying EulerPauseResponse
response_function       = "respond(bytes)"
block_sample_size       = 5
cooldown_period_blocks  = 10
min_number_of_operators = 2
max_number_of_operators = 10
private_trap            = false
whitelist               = []
